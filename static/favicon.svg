<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="petalGradCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="petalGradLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="petalGradRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Botanical Stem -->
  <path d="M32 38 L32 55" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 46 Q38 43 43 45" stroke="url(#stemGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left Fall / Sepal -->
  <path d="M31 34 C21 34 14 38 15 45 C16 49 22 50 27 43 C29 40 31 36 31 34 Z" fill="url(#petalGradLeft)"/>
  <!-- Right Fall / Sepal -->
  <path d="M33 34 C43 34 50 38 49 45 C48 49 42 50 37 43 C35 40 33 36 33 34 Z" fill="url(#petalGradRight)"/>

  <!-- Central Standard Petal -->
  <path d="M32 10 C26 18 26 26 28 34 C30 36 34 36 36 34 C38 26 38 18 32 10 Z" fill="url(#petalGradCenter)"/>
  
  <!-- Left Standard Petal -->
  <path d="M30 18 C23 21 21 28 25 33 C27 34 29 34 30 32 C29 27 28 22 30 18 Z" fill="#6366f1" opacity="0.85"/>
  <!-- Right Standard Petal -->
  <path d="M34 18 C41 21 43 28 39 33 C37 34 35 34 34 32 C35 27 36 22 34 18 Z" fill="#6366f1" opacity="0.85"/>

  <!-- Yellow Signal / Throat Crest -->
  <ellipse cx="25" cy="41" rx="2" ry="3.5" transform="rotate(-30 25 41)" fill="url(#signalGrad)"/>
  <ellipse cx="39" cy="41" rx="2" ry="3.5" transform="rotate(30 39 41)" fill="url(#signalGrad)"/>
  <circle cx="32" cy="35" r="2.5" fill="url(#signalGrad)"/>
</svg>